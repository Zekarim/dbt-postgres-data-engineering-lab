config-version: 2

name: "jaffle_shop"
version: "3.0.0"
require-dbt-version: ">=1.11.0,<2.0.0"

profile: jaffle_shop

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["data-tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  jaffle_shop:
    +schema: raw
    jaffle-data:
      +enabled: "{{ var('load_source_data', false) }}"


tests:
  jaffle_shop:
    +store_failures: true

models:
  jaffle_shop:
    +required_tests:
      unique: 1
      not_null: 1
    staging:
      +materialized: view
    marts:
      +materialized: table
